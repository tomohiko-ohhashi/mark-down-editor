name: CI

# Changes reach main through a pull request from develop, so the pull request run is the check
# for work on develop. Running on pushes to develop as well only repeated the same three jobs.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same pull request (or branch) replaces the run for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p markdown-editor-server --release

      # Browser tests of the real UI (web mode), on one OS.
      - name: Install the browser for the UI tests
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: UI tests
        if: runner.os == 'Linux'
        run: pnpm e2e
