[package]
name = "markdown-editor-server"
description = "Serves the Toucan Markdown Editor UI over HTTP so it can be used from a browser (e.g. a phone) against files on a server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "markdown-editor-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
mde-core = { path = "../mde-core" }
mime_guess = "2"
rand = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
